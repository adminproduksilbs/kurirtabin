<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tanjung Bintang - Jastip & Kurir</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#10233f;padding-bottom:75px}.top{height:72px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:5}.brand{display:flex;gap:10px;align-items:center}.logo{font-size:25px}.title{font-weight:800;font-size:18px}.sub{font-size:13px;color:#718096}.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer}.blue{background:#1769e0;color:#fff}.white{background:#fff;border:1px solid #d9e1ec}.page{max-width:1080px;margin:auto;padding:24px 18px}.hero{background:linear-gradient(135deg,#1769e0,#4d8ff0);color:white;padding:30px;border-radius:22px;margin-bottom:20px}.hero h1{margin:6px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.card{background:white;border:1px solid #e1e7ef;border-radius:16px;padding:18px;box-shadow:0 4px 15px #17365d0d}.num{font-size:28px;font-weight:800;margin-top:7px}.muted{color:#718096;font-size:13px}.tabs{display:flex;gap:8px;overflow:auto;margin:20px 0 14px}.tab{white-space:nowrap}.order{margin:12px 0}.row{display:flex;justify-content:space-between;gap:10px}.status{display:inline-block;padding:6px 9px;border-radius:99px;background:#fff1c9;font-size:12px;font-weight:700}.route{margin:14px 0;line-height:1.7;color:#52637b}.actions{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid #eee;padding-top:12px}.actions select{padding:9px;border:1px solid #d7e0eb;border-radius:9px}.nav{height:75px;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;align-items:center;z-index:4}.nav button{background:none;border:0;font-weight:700;color:#718096}.nav .on{color:#1769e0}.form{max-width:700px}.form input,.form textarea{width:100%;padding:12px;border:1px solid #d7e0eb;border-radius:10px;margin:6px 0 13px}.form label{font-size:13px;font-weight:700}.service{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.service button{text-align:left}.modal{position:fixed;inset:0;background:#10233f88;display:grid;place-items:center;z-index:20;padding:18px}.modalbox{background:white;border-radius:18px;padding:23px;width:min(400px,100%)}.modalbox input{width:100%;padding:12px;margin:6px 0;border:1px solid #d7e0eb;border-radius:9px}.modalbox .btn{width:100%;margin-top:8px}@media(max-width:700px){.stats,.service{grid-template-columns:1fr 1fr}.hero{padding:23px}}
</style></head><body><header class="top"><div class="brand"><div class="logo">🛵</div><div><div class="title">Tanjung Bintang</div><div class="sub">Jastip & Kurir</div></div></div><button id="auth" class="btn blue">Masuk</button></header><main id="app"></main><div id="modal"></div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js';import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js';import{getFirestore,doc,setDoc,getDoc,collection,addDoc,onSnapshot,query,where,serverTimestamp,updateDoc}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js';
const cfg={apiKey:'AIzaSyABpnRRv30zYTN0J_IReUgZPY88FSm9Omw',authDomain:'kurirtabin.firebaseapp.com',projectId:'kurirtabin',storageBucket:'kurirtabin.firebasestorage.app',messagingSenderId:'55763945350',appId:'1:55763945350:web:a06e1e51fea385aa494e07'};const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);let u=null,role='customer',cv='home',filter='Semua',unsub=null;const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function toast(t){alert(t)}
function render(){if(role==='admin')admin();else customer()}
function customer(){let a=$('app');if(cv==='home')a.innerHTML=`<section class="page"><div class="hero"><div>Tanjung Bintang</div><h1>Jastip & Kurir</h1><p>Kirim barang dan titip belanja dengan mudah.</p><button class="btn white" id="send">+ Kirim Barang</button></div><h2>Layanan</h2><div class="service"><button class="btn white" id="send2">📦 <b>Kirim Barang</b><br><small>Pesan kurir</small></button><button class="btn white" id="orders">🧾 <b>Pesanan Saya</b><br><small>Lihat status</small></button><button class="btn white" id="store">🛍️ <b>Jastip & Store</b><br><small>Belanja melalui kami</small></button></div></section>`;else if(cv==='send')a.innerHTML=`<section class="page"><button class="btn white" onclick="location.reload()">← Kembali</button><div class="card form"><h2>Kirim Barang</h2><label>Nama pengirim</label><input id="sn"><label>No. WhatsApp</label><input id="sp"><label>Pickup</label><input id="pu" placeholder="Alamat pickup"><label>Tujuan</label><input id="de" placeholder="Alamat tujuan"><label>Nama penerima</label><input id="rn"><label>No. WhatsApp penerima</label><input id="rp"><label>Detail barang</label><textarea id="it" rows="3"></textarea><label>Catatan</label><textarea id="no" rows="3"></textarea><button class="btn blue" id="make">Buat Pesanan</button></div></section>`;else if(cv==='orders')a.innerHTML=`<section class="page"><h2>Pesanan Saya</h2><div id="mine">Memuat...</div></section>`;else a.innerHTML=`<section class="page"><div class="card"><h2>Profil</h2><p>${esc(u?.email)}</p><button class="btn blue" id="out">Keluar</button></div></section>`;nav();$('send')?.addEventListener('click',()=>{cv='send';render()});$('send2')?.addEventListener('click',()=>{cv='send';render()});$('orders')?.addEventListener('click',()=>{cv='orders';render()});$('store')?.addEventListener('click',()=>toast('Fitur Store/Jastip menyusul.'));$('make')?.addEventListener('click',make);$('out')?.addEventListener('click',()=>signOut(auth));if(cv==='orders')mine()}
function nav(){let a=$('app');a.insertAdjacentHTML('beforeend',`<nav class="nav"><button class="${cv==='home'?'on':''}" data-v="home">⌂<br>Beranda</button><button class="${cv==='send'?'on':''}" data-v="send">＋<br>Kirim</button><button class="${cv==='orders'?'on':''}" data-v="orders">▣<br>Pesanan</button><button class="${cv==='profile'?'on':''}" data-v="profile">◉<br>Profil</button></nav>`);document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{cv=b.dataset.v;render()})}
async function make(){if(!u)return showLogin();let pu=$('pu').value.trim(),de=$('de').value.trim();if(!pu||!de)return toast('Pickup dan tujuan wajib diisi');try{await addDoc(collection(db,'orders'),{customerId:u.uid,customerEmail:u.email,pickup:pu,destination:de,senderName:$('sn').value,senderPhone:$('sp').value,receiverName:$('rn').value,receiverPhone:$('rp').value,itemDetail:$('it').value,note:$('no').value,status:'Menunggu',createdAt:serverTimestamp()});toast('Pesanan berhasil dibuat');cv='orders';render()}catch(e){console.error(e);toast('Gagal menyimpan pesanan. Periksa Rules.')}}
function mine(){if(unsub)unsub();let q=query(collection(db,'orders'),where('customerId','==',u.uid));unsub=onSnapshot(q,s=>{$('mine').innerHTML=s.empty?'<div class="card">Belum ada pesanan.</div>':[...s].map(x=>{let o=x.data();return `<div class="card order"><div class="row"><b>${esc(o.itemDetail||'Pesanan')}</b><span class="status">${esc(o.status||'Menunggu')}</span></div><div class="route">📍 ${esc(o.pickup)}<br>📦 ${esc(o.destination)}</div></div>`}).join('')})}
function admin(){let a=$('app');a.innerHTML=`<section class="page"><div class="hero"><div>ADMIN PANEL</div><h1>Dashboard Pengelolaan</h1><p>Kelola semua pesanan customer.</p></div><div class="stats"><div class="card">Total Pesanan<div class="num" id="total">0</div></div><div class="card">Menunggu<div class="num" id="wait">0</div></div><div class="card">Diproses<div class="num" id="proc">0</div></div><div class="card">Selesai<div class="num" id="done">0</div></div></div><div class="tabs">${['Semua','Menunggu','Diproses','Dikirim','Selesai','Dibatalkan'].map(x=>`<button class="btn ${filter===x?'blue':'white'} tab" data-f="${x}">${x}</button>`).join('')}</div><div id="all">Memuat...</div></section>`;document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filter=b.dataset.f;admin()});watchAll()}
function watchAll(){if(unsub)unsub();unsub=onSnapshot(collection(db,'orders'),s=>{let rows=[...s].map(x=>({id:x.id,...x.data()}));let c=x=>rows.filter(o=>(o.status||'Menunggu')===x).length;$('total').textContent=rows.length;$('wait').textContent=c('Menunggu');$('proc').textContent=c('Diproses');$('done').textContent=c('Selesai');if(filter!=='Semua')rows=rows.filter(o=>(o.status||'Menunggu')===filter);$('all').innerHTML=rows.length?rows.map(o=>`<article class="card order"><div class="row"><div><b>Order ${esc(o.id.slice(0,8))}</b><div class="muted">${esc(o.customerEmail||'Customer')}</div></div><span class="status">${esc(o.status||'Menunggu')}</span></div><div class="route">👤 ${esc(o.senderName||'-')}<br>📍 ${esc(o.pickup||'-')}<br>📦 ${esc(o.destination||'-')}<br>👥 ${esc(o.receiverName||'-')}<br>🧊 ${esc(o.itemDetail||'-')}<br>📝 ${esc(o.note||'-')}</div><div class="actions"><select id="s_${o.id}"><option>Menunggu</option><option>Diproses</option><option>Dikirim</option><option>Selesai</option><option>Dibatalkan</option></select><button class="btn blue" data-save="${o.id}">Simpan Status</button><button class="btn white" data-map="${o.id}">🗺️ Rute</button></div></article>`).join(''):'<div class="card">Tidak ada pesanan.</div>';rows.forEach(o=>{let s=$('s_'+o.id);if(s)s.value=o.status||'Menunggu';document.querySelector(`[data-save="${o.id}"]`)?.addEventListener('click',async()=>{try{await updateDoc(doc(db,'orders',o.id),{status:$('s_'+o.id).value,updatedAt:serverTimestamp(),updatedBy:u.uid});toast('Status diperbarui')}catch(e){console.error(e);toast('Gagal. Rules admin belum mengizinkan update.')}});document.querySelector(`[data-map="${o.id}"]`)?.addEventListener('click',()=>window.open('https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(o.pickup||'')+'&destination='+encodeURIComponent(o.destination||''),'_blank'))})},e=>{$('all').innerHTML='<div class="card">Gagal membaca orders. Pastikan Rules mengizinkan admin membaca orders.</div>'})}
function showLogin(){let m=$('modal');m.innerHTML=`<div class="modal"><div class="modalbox"><h2>Masuk</h2><input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password"><button class="btn blue" id="li">Masuk</button><button class="btn white" id="reg">Daftar Customer</button><p id="err" class="muted"></p></div></div>`;$('li').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('em').value.trim(),$('pw').value);m.innerHTML=''}catch(e){$('err').textContent='Email/password salah'}};$('reg').onclick=async()=>{try{let c=await createUserWithEmailAndPassword(auth,$('em').value.trim(),$('pw').value);await setDoc(doc(db,'users',c.user.uid),{email:c.user.email,role:'customer'});m.innerHTML=''}catch(e){$('err').textContent=e.message}}}
$('auth').onclick=()=>u?signOut(auth):showLogin();onAuthStateChanged(auth,async x=>{u=x;if(unsub){unsub();unsub=null}role='customer';if(u){try{let s=await getDoc(doc(db,'users',u.uid));role=s.exists()?(s.data().role||'customer'):'customer'}catch(e){role='customer'}}$('auth').textContent=u?'Keluar':'Masuk';render()});render();
</script></body></html>
