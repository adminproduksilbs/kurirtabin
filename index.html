<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Tanjung Bintang — Jastip & Kurir</title>
<style>
:root{--green:#10a968;--green2:#087e4d;--mint:#eafaf3;--ink:#12233f;--muted:#718096;--line:#e5eaf0;--bg:#f4f7fb;--white:#fff;--red:#dc3545;--orange:#f59e0b;--blue:#2563eb;--shadow:0 10px 30px rgba(16,35,63,.08)}
*{box-sizing:border-box}html,body{margin:0;padding:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}
.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:50}.brand{display:flex;gap:10px;align-items:center}.brand-icon{width:43px;height:43px;border-radius:13px;background:var(--mint);display:grid;place-items:center;font-size:23px}.brand-title{font-weight:900;font-size:18px}.brand-sub{font-size:12px;color:var(--muted);margin-top:1px}.auth-btn{border:0;background:var(--green);color:#fff;border-radius:12px;padding:11px 18px;font-weight:850}
.wrap{max-width:1100px;margin:auto;padding:22px 18px 105px}.customer-shell{max-width:980px;margin:auto}
.hero{background:linear-gradient(135deg,#099b5f,#31c77f);border-radius:24px;padding:30px;color:#fff;position:relative;overflow:hidden;min-height:220px;box-shadow:var(--shadow)}.hero:after{content:"📦";position:absolute;right:45px;bottom:-8px;font-size:100px;opacity:.22}.hero small{font-weight:700}.hero h1{font-size:36px;margin:8px 0}.hero p{margin:0 0 20px;color:#eafff4}.primary{background:var(--green);border:0;color:#fff;border-radius:11px;padding:12px 17px;font-weight:850}.hero .primary{background:#fff;color:#087e4d}.section-title{display:flex;align-items:center;justify-content:space-between;margin:25px 0 12px}.section-title h2{margin:0;font-size:21px}.link-btn{border:0;background:none;color:var(--green2);font-weight:800}
.services{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.service{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px;text-align:left;box-shadow:0 4px 15px rgba(16,35,63,.03)}.service .ico{font-size:28px;margin-bottom:9px}.service b{display:block}.service small{display:block;color:var(--muted);margin-top:4px}
.recent{display:grid;gap:10px}.order-mini{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;display:flex;justify-content:space-between;gap:12px;align-items:center}.order-mini .left{min-width:0}.order-mini .id{font-weight:850}.order-mini .route{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:600px}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:850;background:#edf2f7;color:#53657e}.badge.menunggu{background:#fff5d9;color:#9a6700}.badge.diproses{background:#e7f0ff;color:#245bb3}.badge.dikirim{background:#e1f7ff;color:#08728b}.badge.selesai{background:#e4f8ed;color:#087543}.badge.dibatalkan{background:#ffe5e7;color:#b4232f}
.bottom{height:76px;background:#fff;border-top:1px solid var(--line);position:fixed;bottom:0;left:0;right:0;z-index:45;display:grid;grid-template-columns:repeat(4,1fr)}.bottom button{border:0;background:none;color:#718096;font-size:12px;font-weight:800}.bottom button.active{color:var(--green2)}.bottom .bi{font-size:19px;display:block;margin-bottom:3px}
.form-card{background:#fff;border:1px solid var(--line);border-radius:19px;padding:20px;box-shadow:var(--shadow);max-width:760px}.stepper{display:flex;gap:7px;margin-bottom:18px}.step{flex:1;height:7px;background:#e7edf2;border-radius:99px}.step.on{background:var(--green)}label{font-size:13px;font-weight:800;display:block;margin:12px 0 6px}input,select,textarea{width:100%;border:1px solid #d8e0e9;border-radius:11px;padding:12px;background:#fff;color:var(--ink)}textarea{resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.map-btn{border:1px solid #cfe7dc;background:var(--mint);color:var(--green2);padding:10px;border-radius:10px;font-weight:800;margin-top:8px}.service-choice{border:1px solid var(--line);border-radius:14px;padding:13px;margin:8px 0;display:flex;justify-content:space-between;gap:10px}.service-choice.selected{border:2px solid var(--green);background:var(--mint)}.service-choice b{display:block}.service-choice small{color:var(--muted)}.summary{background:#f8fafc;border:1px solid var(--line);border-radius:13px;padding:14px;line-height:1.7}.actions{display:flex;gap:9px;margin-top:15px;flex-wrap:wrap}.secondary{background:#fff;border:1px solid #d6dee8;color:var(--ink);border-radius:11px;padding:11px 15px;font-weight:800}.danger{background:#fff;border:1px solid #f2c2c7;color:#b4232f;border-radius:11px;padding:10px 13px;font-weight:800}
.track{background:#fff;border:1px solid var(--line);border-radius:19px;padding:20px;box-shadow:var(--shadow)}.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:20px 0}.titem{text-align:center;position:relative}.tdot{width:34px;height:34px;border-radius:50%;background:#e6edf2;color:#738096;margin:auto;display:grid;place-items:center;font-size:14px}.titem.done .tdot{background:var(--green);color:#fff}.titem b{font-size:11px;display:block;margin-top:7px}.trackline{height:3px;background:#e5ebef;margin-top:-20px;margin-bottom:17px}.trackline span{display:block;height:100%;background:var(--green);width:0}.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.info{background:#f8fafc;border-radius:13px;padding:13px}.info small{display:block;color:var(--muted);margin-bottom:4px}.profile{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px}.avatar{width:66px;height:66px;border-radius:50%;background:var(--mint);display:grid;place-items:center;font-size:30px;margin-bottom:12px}
.empty{background:#fff;border:1px dashed #ccd6e0;border-radius:16px;padding:30px;text-align:center;color:var(--muted)}
/* ADMIN */
.admin-layout{display:grid;grid-template-columns:220px 1fr;gap:20px}.side{background:#10233f;color:#dce7f5;border-radius:18px;padding:15px;height:max-content;position:sticky;top:92px}.side h3{margin:5px 10px 18px;color:#fff}.side button{display:block;width:100%;border:0;background:none;color:#c8d6e7;text-align:left;padding:12px 11px;border-radius:10px;font-weight:750;margin:3px 0}.side button.active,.side button:hover{background:#1d385b;color:#fff}.admin-main{min-width:0}.admin-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.admin-head h1{margin:0}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px}.kpi .num{font-size:28px;font-weight:900;margin-top:7px}.admin-card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:17px;margin-top:15px}.admin-tabs{display:flex;gap:7px;overflow:auto;margin-bottom:13px}.admin-tabs button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-weight:800}.admin-tabs button.active{background:var(--green);color:#fff;border-color:var(--green)}.admin-order{border:1px solid var(--line);border-radius:14px;padding:15px;margin:10px 0}.admin-order-head{display:flex;justify-content:space-between;gap:12px}.admin-order-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;font-size:13px}.admin-order-grid div{background:#f8fafc;padding:9px;border-radius:9px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;white-space:nowrap}.product-row{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:12px 0}.modal{position:fixed;inset:0;background:rgba(8,20,35,.55);display:grid;place-items:center;padding:18px;z-index:100}.modalbox{background:#fff;width:min(440px,100%);border-radius:19px;padding:22px}.modalbox h2{margin-top:0}.close{float:right;border:0;background:none;font-size:25px}.err{color:#b4232f;font-size:13px;margin-top:9px}.toast{position:fixed;left:50%;bottom:94px;transform:translateX(-50%);background:#10233f;color:#fff;padding:12px 17px;border-radius:12px;z-index:200;box-shadow:var(--shadow)}
@media(max-width:800px){.admin-layout{grid-template-columns:1fr}.side{position:static;display:flex;overflow:auto;gap:5px}.side h3{display:none}.side button{white-space:nowrap;width:auto}.kpis{grid-template-columns:repeat(2,1fr)}.services{grid-template-columns:1fr}.grid2,.info-grid,.admin-order-grid{grid-template-columns:1fr}.hero h1{font-size:30px}.hero:after{right:-8px}.wrap{padding-left:13px;padding-right:13px}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><div class="brand-icon">🛵</div><div><div class="brand-title">Tanjung Bintang</div><div class="brand-sub">Jastip & Kurir</div></div></div>
  <button class="auth-btn" id="authBtn">Masuk</button>
</header>
<main id="app" class="wrap"></main>
<div id="modal"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import {getFirestore,doc,setDoc,getDoc,collection,addDoc,onSnapshot,query,where,serverTimestamp,updateDoc,orderBy,limit} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyABpnRRv30zYTN0J_IReUgZPY88FSm9Omw",authDomain:"kurirtabin.firebaseapp.com",projectId:"kurirtabin",storageBucket:"kurirtabin.firebasestorage.app",messagingSenderId:"55763945350",appId:"1:55763945350:web:a06e1e51fea385aa494e07"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
let user=null,role="guest",page="home",adminPage="dashboard",filter="Semua",customerOrders=[],allOrders=[],stopOrders=null,stopAdmin=null,products=[],adminProducts=[];
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2400)}
function statusClass(s){return String(s||"Menunggu").toLowerCase().replaceAll(" ","")}
function money(n){return "Rp "+Number(n||0).toLocaleString("id-ID")}
function orderNo(id){return "#TB"+String(id||"").slice(-6).toUpperCase()}
function openMaps(a,b){window.open("https://www.google.com/maps/dir/?api=1&origin="+encodeURIComponent(a||"")+"&destination="+encodeURIComponent(b||""),"_blank")}
function stopListeners(){if(stopOrders){stopOrders();stopOrders=null}if(stopAdmin){stopAdmin();stopAdmin=null}}
function customerNav(p){page=p;render()}
function adminNav(p){adminPage=p;render()}

function render(){
 stopListeners();
 if(role==="admin") renderAdmin();
 else renderCustomer();
 bindCommon();
 if(role==="customer" && page==="orders") watchCustomerOrders();
 if(role==="customer" && page==="home") watchRecent();
 if(role==="admin" && adminPage==="dashboard") watchAdminOrders();
 if(role==="admin" && adminPage==="orders") watchAdminOrders();
 if(role==="admin" && adminPage==="customers") watchAdminCustomers();
 if(role==="admin" && adminPage==="products") watchAdminProducts();
}

function renderCustomer(){
 const a=$("#app");
 if(page==="home") a.innerHTML=`<div class="customer-shell">
  <section class="hero"><small>Tanjung Bintang</small><h1>Jastip & Kurir</h1><p>Kirim barang dan titip belanja dengan mudah, cepat, dan aman.</p><button class="primary" data-customer="send">+ Kirim Barang</button></section>
  <div class="section-title"><h2>Layanan</h2></div>
  <div class="services">
   <button class="service" data-customer="send"><div class="ico">📦</div><b>Kirim Barang</b><small>Pesan kurir untuk mengirim barang</small></button>
   <button class="service" data-customer="jastip"><div class="ico">🛍️</div><b>Jastip & Store</b><small>Titip belanja melalui kami</small></button>
   <button class="service" data-customer="orders"><div class="ico">🧾</div><b>Pesanan Saya</b><small>Lihat status dan detail pesanan</small></button>
  </div>
  <div class="section-title"><h2>Pesanan Terbaru</h2><button class="link-btn" data-customer="orders">Lihat Semua</button></div>
  <div id="recent" class="recent"><div class="empty">Memuat pesanan...</div></div>
 </div>${customerBottom("home")}`;
 else if(page==="send") a.innerHTML=sendPage();
 else if(page==="jastip") a.innerHTML=jastipPage();
 else if(page==="orders") a.innerHTML=`<div class="customer-shell"><div class="section-title"><h2>Pesanan Saya</h2><button class="primary" data-customer="send">+ Pesanan Baru</button></div><div id="ordersList"><div class="empty">Memuat...</div></div></div>${customerBottom("orders")}`;
 else if(page==="track") a.innerHTML=trackPage();
 else if(page==="profile") a.innerHTML=`<div class="customer-shell"><div class="profile"><div class="avatar">👤</div><h2>Profil Saya</h2><p>${esc(user?.email)}</p><div class="info-grid"><div class="info"><small>Status akun</small><b>Customer</b></div><div class="info"><small>Area layanan</small><b>Tanjung Bintang</b></div></div><div class="actions"><button class="secondary" data-logout>Keluar</button></div></div></div>${customerBottom("profile")}`;
}
function customerBottom(active){return `<nav class="bottom">${[["home","⌂","Beranda"],["send","＋","Kirim"],["orders","▣","Pesanan"],["profile","◉","Profil"]].map(x=>`<button class="${active===x[0]?"active":""}" data-customer="${x[0]}"><span class="bi">${x[1]}</span>${x[2]}</button>`).join("")}</nav>`}

function sendPage(){return `<div class="customer-shell"><button class="secondary" data-customer="home">← Kembali</button><div class="form-card" style="margin-top:12px"><h2>Kirim Barang</h2><div class="stepper"><span class="step on"></span><span class="step on"></span><span class="step on"></span><span class="step on"></span></div>
<label>Nama pengirim</label><input id="senderName" placeholder="Nama Anda">
<div class="grid2"><div><label>No. WhatsApp pengirim</label><input id="senderPhone" placeholder="08xxxxxxxxxx"></div><div><label>Nama penerima</label><input id="receiverName" placeholder="Nama penerima"></div></div>
<div class="grid2"><div><label>No. WhatsApp penerima</label><input id="receiverPhone" placeholder="08xxxxxxxxxx"></div><div><label>Berat barang</label><input id="weight" type="number" min="1" value="1" placeholder="kg"></div></div>
<label>Alamat pickup</label><input id="pickup" placeholder="Contoh: Tanjung Bintang, Lampung Selatan"><button class="map-btn" id="mapPickup">📍 Buka Google Maps</button>
<label>Alamat tujuan</label><input id="destination" placeholder="Alamat tujuan"><button class="map-btn" id="mapDest">📍 Buka Google Maps</button>
<label>Detail barang</label><textarea id="itemDetail" rows="3" placeholder="Contoh: 1 dus makanan beku"></textarea>
<label>Catatan</label><textarea id="note" rows="2" placeholder="Catatan untuk kurir (opsional)"></textarea>
<label>Pilih layanan</label>
<div class="service-choice selected" data-service="Instant"><div><b>⚡ Instant</b><small>Prioritas pengantaran</small></div><strong>Rp 15.000</strong></div>
<div class="service-choice" data-service="Reguler"><div><b>🛵 Reguler</b><small>Pengantaran standar</small></div><strong>Rp 10.000</strong></div>
<label>Metode pembayaran</label><select id="payment"><option value="COD">COD</option><option value="Transfer">Transfer</option></select>
<div class="summary" style="margin-top:15px"><b>Perkiraan biaya</b><br>Biaya layanan <span id="feeText">Rp 15.000</span><br><small>Biaya final dapat disesuaikan admin berdasarkan area/jarak.</small></div>
<div class="actions"><button class="primary" id="submitSend">Buat Pesanan</button><button class="secondary" data-customer="home">Batal</button></div>
</div></div>${customerBottom("send")}`}
function jastipPage(){return `<div class="customer-shell"><button class="secondary" data-customer="home">← Kembali</button><div class="form-card" style="margin-top:12px"><h2>🛍️ Jastip & Store</h2><p class="muted">Kirim daftar barang yang ingin dititipkan. Admin akan menghubungi Anda untuk konfirmasi harga.</p><label>Nama toko / tempat belanja</label><input id="shop" placeholder="Contoh: Pasar Tanjung Bintang"><label>Alamat toko</label><input id="shopAddress" placeholder="Alamat toko"><label>Daftar barang</label><textarea id="shoppingList" rows="5" placeholder="1. Ayam 2 kg&#10;2. Saus 2 botol"></textarea><label>Alamat pengantaran</label><input id="jastipDestination" placeholder="Alamat Anda"><label>Metode pembayaran</label><select id="jastipPayment"><option>COD</option><option>Transfer</option></select><button class="primary" id="submitJastip" style="width:100%;margin-top:15px">Kirim Permintaan Jastip</button></div></div>${customerBottom("home")}`}
function trackPage(){const o=customerOrders.find(x=>x.id===window.currentTrackId);if(!o)return `<div class="customer-shell"><div class="empty">Pesanan tidak ditemukan.</div></div>${customerBottom("orders")}`;const steps=["Menunggu","Diproses","Dikirim","Selesai"],idx=Math.max(0,steps.indexOf(o.status||"Menunggu"));return `<div class="customer-shell"><button class="secondary" data-customer="orders">← Kembali</button><div class="track" style="margin-top:12px"><div style="display:flex;justify-content:space-between;gap:10px"><div><small class="muted">Nomor Pesanan</small><h2 style="margin:3px 0">${orderNo(o.id)}</h2></div><span class="badge ${statusClass(o.status)}">${esc(o.status||"Menunggu")}</span></div><div class="timeline">${steps.map((s,i)=>`<div class="titem ${i<=idx?"done":""}"><div class="tdot">${i<=idx?"✓":i+1}</div><b>${s}</b></div>`).join("")}</div><div class="trackline"><span style="width:${idx/3*100}%"></span></div><div class="info-grid"><div class="info"><small>Pickup</small><b>${esc(o.pickup)}</b></div><div class="info"><small>Tujuan</small><b>${esc(o.destination)}</b></div><div class="info"><small>Barang</small><b>${esc(o.itemDetail)}</b></div><div class="info"><small>Pembayaran</small><b>${esc(o.paymentMethod||"COD")}</b></div></div><div class="actions"><button class="primary" id="routeTrack">🗺️ Lihat Rute</button></div></div></div>${customerBottom("orders")}`}
function watchRecent(){if(!user)return;stopOrders=onSnapshot(query(collection(db,"orders"),where("customerId","==",user.uid)),s=>{const rows=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)).slice(0,3);const el=$("#recent");if(!rows.length){el.innerHTML='<div class="empty">Belum ada pesanan. Silakan buat pesanan pertama.</div>';return}el.innerHTML=rows.map(o=>miniOrder(o)).join("");bindOrderButtons()})}
function watchCustomerOrders(){if(!user)return;stopOrders=onSnapshot(query(collection(db,"orders"),where("customerId","==",user.uid)),s=>{customerOrders=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));const el=$("#ordersList");if(!el)return;if(!customerOrders.length){el.innerHTML='<div class="empty">Belum ada pesanan.</div>';return}el.innerHTML=customerOrders.map(o=>miniOrder(o,true)).join("");bindOrderButtons()})}
function miniOrder(o,full=false){return `<div class="order-mini"><div class="left"><div class="id">${orderNo(o.id)} · ${esc(o.service||"Kurir")}</div><div class="route">📍 ${esc(o.pickup||"-")} → 📦 ${esc(o.destination||"-")}</div>${full?`<div class="muted" style="margin-top:5px">${esc(o.itemDetail||"-")} · ${esc(o.paymentMethod||"COD")}</div>`:""}</div><div><span class="badge ${statusClass(o.status)}">${esc(o.status||"Menunggu")}</span><button class="link-btn" data-track="${o.id}">Lihat</button></div></div>`}
function bindOrderButtons(){$$("[data-track]").forEach(b=>b.onclick=()=>{window.currentTrackId=b.dataset.track;page="track";render()})}

function renderAdmin(){
 const a=$("#app");const navs=[["dashboard","📊","Dashboard"],["orders","📦","Pesanan"],["customers","👥","Customer"],["products","🛍️","Produk"],["reports","📈","Laporan"]];
 a.innerHTML=`<div class="admin-layout"><aside class="side"><h3>ADMIN PANEL</h3>${navs.map(n=>`<button class="${adminPage===n[0]?"active":""}" data-admin="${n[0]}">${n[1]} ${n[2]}</button>`).join("")}<button data-logout>↪ Keluar</button></aside><section class="admin-main">${adminPage==="dashboard"?adminDashboard():adminPage==="orders"?adminOrdersPage():adminPage==="customers"?adminCustomersPage():adminPage==="products"?adminProductsPage():adminReportsPage()}</section></div>`;
 $$("[data-admin]").forEach(b=>b.onclick=()=>adminNav(b.dataset.admin));
}
function adminDashboard(){return `<div class="admin-head"><div><h1>Dashboard Admin</h1><div class="muted">Kelola operasional Tanjung Bintang</div></div></div><div class="kpis"><div class="kpi"><div class="muted">Total Pesanan</div><div class="num" id="aTotal">0</div></div><div class="kpi"><div class="muted">Menunggu</div><div class="num" id="aWait">0</div></div><div class="kpi"><div class="muted">Dikirim</div><div class="num" id="aShip">0</div></div><div class="kpi"><div class="muted">Selesai</div><div class="num" id="aDone">0</div></div></div><div class="admin-card"><h3>Pesanan Terbaru</h3><div id="adminRecent"><div class="empty">Memuat...</div></div></div>`}
function adminOrdersPage(){return `<div class="admin-head"><div><h1>Kelola Pesanan</h1><div class="muted">Semua pesanan customer</div></div></div><div class="admin-card"><div class="admin-tabs">${["Semua","Menunggu","Diproses","Dikirim","Selesai","Dibatalkan"].map(f=>`<button class="${filter===f?"active":""}" data-filter="${f}">${f}</button>`).join("")}</div><div id="adminOrders"><div class="empty">Memuat...</div></div></div>`}
function adminCustomersPage(){return `<div class="admin-head"><div><h1>Customer</h1><div class="muted">Daftar customer yang pernah membuat pesanan</div></div></div><div class="admin-card"><div id="customerTable"><div class="empty">Memuat...</div></div></div>`}
function adminProductsPage(){return `<div class="admin-head"><div><h1>Produk & Store</h1><div class="muted">Kelola katalog jastip</div></div><button class="primary" id="addProduct">+ Produk</button></div><div class="admin-card"><div id="productTable"><div class="empty">Memuat...</div></div></div>`}
function adminReportsPage(){return `<div class="admin-head"><div><h1>Laporan</h1><div class="muted">Ringkasan pesanan dan status</div></div></div><div class="admin-card"><h3>Rekap</h3><div id="reportBox"><div class="empty">Memuat...</div></div></div>`}
function watchAdminOrders(){stopAdmin=onSnapshot(collection(db,"orders"),s=>{allOrders=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));updateAdminStats();if(adminPage==="dashboard"){const el=$("#adminRecent");if(el)el.innerHTML=allOrders.slice(0,8).map(adminOrder).join("")||'<div class="empty">Belum ada pesanan.</div>'}else if(adminPage==="orders"){const el=$("#adminOrders");let rows=filter==="Semua"?allOrders:allOrders.filter(o=>(o.status||"Menunggu")===filter);el.innerHTML=rows.map(adminOrder).join("")||'<div class="empty">Tidak ada pesanan pada status ini.</div>';bindAdminOrderActions();}} ,e=>toast("Tidak bisa membaca orders: "+e.message))}
function updateAdminStats(){const c=s=>allOrders.filter(o=>(o.status||"Menunggu")===s).length;$("#aTotal")?.replaceChildren(document.createTextNode(allOrders.length));$("#aWait")?.replaceChildren(document.createTextNode(c("Menunggu")));$("#aShip")?.replaceChildren(document.createTextNode(c("Dikirim")));$("#aDone")?.replaceChildren(document.createTextNode(c("Selesai")))}
function adminOrder(o){return `<article class="admin-order"><div class="admin-order-head"><div><b>${orderNo(o.id)}</b><div class="muted">${esc(o.customerEmail||"Customer")}</div></div><span class="badge ${statusClass(o.status)}">${esc(o.status||"Menunggu")}</span></div><div class="admin-order-grid"><div><b>Pengirim</b><br>${esc(o.senderName||"-")} · ${esc(o.senderPhone||"-")}</div><div><b>Penerima</b><br>${esc(o.receiverName||"-")} · ${esc(o.receiverPhone||"-")}</div><div><b>Pickup</b><br>${esc(o.pickup||"-")}</div><div><b>Tujuan</b><br>${esc(o.destination||"-")}</div><div><b>Barang</b><br>${esc(o.itemDetail||"-")}</div><div><b>Pembayaran</b><br>${esc(o.paymentMethod||"COD")}</div></div><div class="actions"><select data-status="${o.id}">${["Menunggu","Diproses","Dikirim","Selesai","Dibatalkan"].map(s=>`<option ${s===(o.status||"Menunggu")?"selected":""}>${s}</option>`).join("")}</select><button class="primary" data-save="${o.id}">Simpan Status</button><button class="secondary" data-map="${o.id}">🗺️ Rute</button></div></article>`}
function bindAdminOrderActions(){$$("[data-save]").forEach(b=>b.onclick=async()=>{const id=b.dataset.save,s=$(`[data-status="${id}"]`).value;try{await updateDoc(doc(db,"orders",id),{status:s,updatedAt:serverTimestamp(),updatedBy:user.uid});toast("Status berhasil diperbarui")}catch(e){toast("Gagal: "+e.message)}});$$("[data-map]").forEach(b=>b.onclick=()=>{const o=allOrders.find(x=>x.id===b.dataset.map);openMaps(o?.pickup,o?.destination)});$$("[data-filter]").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()})}
function watchAdminCustomers(){const el=$("#customerTable");stopAdmin=onSnapshot(collection(db,"users"),s=>{const rows=s.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.role==="customer");el.innerHTML=`<div class="table-wrap"><table class="table"><thead><tr><th>Email</th><th>Role</th><th>Jumlah Pesanan</th></tr></thead><tbody>${rows.map(c=>`<tr><td>${esc(c.email||"-")}</td><td>Customer</td><td>${allOrders.filter(o=>o.customerId===c.id).length}</td></tr>`).join("")}</tbody></table></div>`||'<div class="empty">Belum ada customer.</div>'})}
function watchAdminProducts(){const el=$("#productTable");stopAdmin=onSnapshot(collection(db,"products"),s=>{adminProducts=s.docs.map(d=>({id:d.id,...d.data()}));el.innerHTML=adminProducts.length?adminProducts.map(p=>`<div class="product-row"><div><b>${esc(p.name)}</b><div class="muted">${money(p.price)} · ${esc(p.category||"Umum")}</div></div><button class="danger" data-delprod="${p.id}">Hapus</button></div>`).join(""):'<div class="empty">Belum ada produk. Tambahkan produk dari tombol + Produk.</div>';$$("[data-delprod]").forEach(b=>b.onclick=async()=>{try{await import("https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js").then(m=>m.deleteDoc(m.doc(db,"products",b.dataset.delprod)));toast("Produk dihapus")}catch(e){toast(e.message)}})})}
function bindCommon(){
 $$("[data-customer]").forEach(b=>b.onclick=()=>customerNav(b.dataset.customer));
 $$("[data-logout]").forEach(b=>b.onclick=()=>signOut(auth));
 $("#mapPickup")?.addEventListener("click",()=>openMaps($("#pickup").value,""));
 $("#mapDest")?.addEventListener("click",()=>openMaps("",$("#destination").value));
 $$(".service-choice").forEach(b=>b.onclick=()=>{$$(".service-choice").forEach(x=>x.classList.remove("selected"));b.classList.add("selected");$("#feeText").textContent=b.dataset.service==="Instant"?money(15000):money(10000)});
 $("#submitSend")?.addEventListener("click",submitSend);
 $("#submitJastip")?.addEventListener("click",submitJastip);
 $("#routeTrack")?.addEventListener("click",()=>{const o=customerOrders.find(x=>x.id===window.currentTrackId);openMaps(o?.pickup,o?.destination)});
 $("#addProduct")?.addEventListener("click",showProductModal);
}
async function submitSend(){if(!user){showLogin();return}const req=["senderName","senderPhone","receiverName","receiverPhone","pickup","destination","itemDetail"];if(req.some(id=>!$("#"+id)?.value.trim())){toast("Lengkapi data pengiriman.");return}const svc=$(".service-choice.selected")?.dataset.service||"Instant";try{const ref=await addDoc(collection(db,"orders"),{type:"kurir",customerId:user.uid,customerEmail:user.email,senderName:$("#senderName").value.trim(),senderPhone:$("#senderPhone").value.trim(),receiverName:$("#receiverName").value.trim(),receiverPhone:$("#receiverPhone").value.trim(),pickup:$("#pickup").value.trim(),destination:$("#destination").value.trim(),itemDetail:$("#itemDetail").value.trim(),note:$("#note").value.trim(),weight:Number($("#weight").value||1),service:svc,paymentMethod:$("#payment").value,estimatedFee:svc==="Instant"?15000:10000,status:"Menunggu",createdAt:serverTimestamp()});toast("Pesanan "+orderNo(ref.id)+" berhasil dibuat");page="orders";render()}catch(e){toast("Gagal membuat pesanan: "+e.message)}}
async function submitJastip(){if(!user){showLogin();return}if(!$("#shop").value.trim()||!$("#shoppingList").value.trim()||!$("#jastipDestination").value.trim()){toast("Lengkapi data jastip.");return}try{await addDoc(collection(db,"orders"),{type:"jastip",customerId:user.uid,customerEmail:user.email,shop:$("#shop").value.trim(),shopAddress:$("#shopAddress").value.trim(),shoppingList:$("#shoppingList").value.trim(),destination:$("#jastipDestination").value.trim(),paymentMethod:$("#jastipPayment").value,status:"Menunggu",service:"Jastip",createdAt:serverTimestamp()});toast("Permintaan jastip berhasil dikirim");page="orders";render()}catch(e){toast("Gagal: "+e.message)}}
function showLogin(){const m=$("#modal");m.innerHTML=`<div class="modal"><div class="modalbox"><button class="close" id="closeModal">×</button><h2>Masuk</h2><p class="muted">Masuk sebagai customer atau admin.</p><label>Email</label><input id="loginEmail" type="email" placeholder="email@contoh.com"><label>Password</label><input id="loginPass" type="password" placeholder="Password"><button class="primary" id="doLogin" style="width:100%;margin-top:12px">Masuk</button><button class="secondary" id="doRegister" style="width:100%;margin-top:8px">Daftar Customer</button><div id="loginErr" class="err"></div></div></div>`;$("#closeModal").onclick=()=>m.innerHTML="";$("#doLogin").onclick=async()=>{try{await signInWithEmailAndPassword(auth,$("#loginEmail").value.trim(),$("#loginPass").value);m.innerHTML=""}catch(e){$("#loginErr").textContent="Login gagal. Periksa email dan password."}};$("#doRegister").onclick=async()=>{try{const c=await createUserWithEmailAndPassword(auth,$("#loginEmail").value.trim(),$("#loginPass").value);await setDoc(doc(db,"users",c.user.uid),{email:c.user.email,role:"customer",createdAt:serverTimestamp()});m.innerHTML=""}catch(e){$("#loginErr").textContent=e.message}}}
function showProductModal(){const m=$("#modal");m.innerHTML=`<div class="modal"><div class="modalbox"><button class="close" id="px">×</button><h2>Tambah Produk</h2><label>Nama produk</label><input id="pn" placeholder="Nama barang"><label>Harga</label><input id="pp" type="number" placeholder="15000"><label>Kategori</label><input id="pc" placeholder="Makanan"><button class="primary" id="saveProd" style="width:100%;margin-top:12px">Simpan</button></div></div>`;$("#px").onclick=()=>m.innerHTML="";$("#saveProd").onclick=async()=>{try{await addDoc(collection(db,"products"),{name:$("#pn").value.trim(),price:Number($("#pp").value||0),category:$("#pc").value.trim()||"Umum",createdAt:serverTimestamp()});m.innerHTML="";toast("Produk ditambahkan")}catch(e){toast(e.message)}}}
async function loadRole(u){if(!u)return"guest";try{const s=await getDoc(doc(db,"users",u.uid));const r=String(s.data()?.role||"customer").trim().toLowerCase();return r==="admin"?"admin":"customer"}catch(e){return"customer"}}
$("#authBtn").onclick=()=>user?signOut(auth):showLogin();
onAuthStateChanged(auth,async u=>{user=u;role=await loadRole(u);$("#authBtn").textContent=u?"Keluar":"Masuk";if(!u){page="home"}render()});
render();
</script>
</body>
</html>
